<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Worksly</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="popup">
  <div class="popup-header">
    <p class="popup-title"><span class="mark">W</span>Worksly</p>
    <div class="legend">
      <div class="legend-row"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--accent)"><path d="M12 2a15 15 0 0 1 0 20"/><path d="M12 2a15 15 0 0 0 0 20"/><path d="M2 12h20"/><circle cx="12" cy="12" r="10"/></svg><b>Доступ</b> — открыт ли сайт по IP</div>
      <div class="legend-row"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--partner)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg><b>Оплата</b> — работает ли карта РФ</div>
      <div class="legend-note">Статусы — для прямого подключения из РФ</div>
    </div>
    <div class="search-row">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Steam, Netflix, ChatGPT..." autocomplete="off">
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="all">Все сервисы</div>
      <div class="tab" data-tab="fav">Избранное <span id="fav-count"></span></div>
    </div>
  </div>

  <div class="list" id="list"></div>

  <div class="popup-footer">
    <span id="footer-count"></span>
  </div>
</div>

<div class="toast" id="toast"></div>

<template id="card-template">
  <div class="card" data-id="">
    <div class="card-top" data-toggle>
      <div class="card-icon">
        <img class="icon-img" src="" alt="" loading="lazy">
      </div>
      <div class="card-main">
        <div class="card-name"></div>
        <div class="card-sub"></div>
        <div class="card-status-line"></div>
        <div class="badges-row">
          <span class="badge badge-access">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a15 15 0 0 1 0 20"/><path d="M12 2a15 15 0 0 0 0 20"/><path d="M2 12h20"/><circle cx="12" cy="12" r="10"/></svg>
            <span class="badge-text"></span>
          </span>
          <span class="badge badge-pay">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
            <span class="badge-text"></span>
          </span>
        </div>
      </div>
      <div class="head-actions">
        <button class="ping-btn" data-ping title="Проверить у себя">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        </button>
        <svg class="heart" data-heart viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.4 3-5.5A5.5 5.5 0 0 0 12 5a5.5 5.5 0 0 0-10 3.5c0 5.5 10 11.5 10 11.5s2.5-1.5 5-3.7"/></svg>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>
    <div class="card-body">
      <div class="card-body-inner">
        <div class="card-body-content">
          <div class="status-rows">
            <div class="status-box status-box--access">
              <div class="status-box-dot"></div>
              <div class="status-box-body">
                <div class="status-box-title"></div>
                <div class="status-box-note access-note"></div>
              </div>
            </div>
            <div class="status-box status-box--pay">
              <div class="status-box-dot"></div>
              <div class="status-box-body">
                <div class="status-box-title"></div>
                <div class="status-box-note pay-note"></div>
              </div>
            </div>
          </div>
          <div class="card-desc"></div>
          <div class="card-diag">
            <div class="diag-idle">
              <div class="diag-line diag-line--server">со стороны РФ · <span class="diag-server-time">проверяем…</span></div>
              <div class="diag-line diag-line--client">с вашего устройства · <span class="diag-client-status">пока не проверяли</span></div>
              <button type="button" class="diag-btn" data-diag-ping>проверить сейчас</button>
            </div>
            <div class="diag-result" hidden>
              <div class="diag-result-head">
                <div class="diag-result-icon">
                  <svg class="diag-icon-ok" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                  <svg class="diag-icon-bad" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </div>
                <div class="diag-result-title"></div>
              </div>
              <div class="diag-result-note"></div>
              <div class="diag-result-stamp"></div>
              <button type="button" class="diag-btn" data-diag-ping>проверить ещё раз</button>
            </div>
            <div class="diag-server-footer" hidden>
              <div class="diag-line diag-line--server">со стороны РФ · <span class="diag-server-footer-time">проверяем…</span></div>
            </div>
          </div>
          <div class="verified-section" hidden>
            <div class="verified-head">
              <span class="verified-title">Проверенные сервисы</span>
              <span class="verified-count"></span>
            </div>
            <div class="verified-group verified-group--pay" hidden>
              <div class="verified-group-title">Оплата и подписки</div>
              <div class="verified-list pay-list"></div>
            </div>
            <div class="verified-disclaimer"></div>
          </div>
          <div class="card-collapse-row">
            <button type="button" class="card-collapse-btn" data-collapse>Свернуть ⌃</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="verified-item-template">
  <div class="verified-item" data-verified-item>
    <div class="verified-item-dot"></div>
    <div class="verified-item-body">
      <div class="verified-item-name-row">
        <span class="verified-item-name"></span>
        <span class="verified-item-badge" hidden>Партнёр</span>
      </div>
      <div class="verified-item-desc"></div>
    </div>
    <div class="verified-item-arrow">↗</div>
  </div>
</template>

<script type="module" src="popup.js"></script>
</body>
</html>
